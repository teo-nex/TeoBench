name: Check Easy benchmark
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux sandbox
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Permit Bubblewrap user namespaces on disposable Ubuntu runner
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        # Ubuntu's AppArmor restriction otherwise blocks unprivileged bwrap.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Verify original dataset
        run: /usr/bin/python3 -m teobench verify
      - name: Test graders and public commands
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Test restricted local Docker fallback
        if: runner.os == 'Linux'
        env:
          TEOBENCH_PYTHON_SANDBOX: docker
          PYTHONPATH: tests
        run: |
          docker pull "$(/usr/bin/python3 -c 'from teobench.evaluate import DOCKER_IMAGE; print(DOCKER_IMAGE)')"
          /usr/bin/python3 -m teobench doctor
          /usr/bin/python3 -m unittest -v test_benchmark.BenchmarkTests.test_all_oracles_pass_and_empty_answers_fail test_benchmark.BenchmarkTests.test_code_restrictions_and_timeout test_benchmark.BenchmarkTests.test_os_sandbox_denies_references_and_network test_benchmark.BenchmarkTests.test_linux_sandbox_hides_host_files_environment_and_denies_writes
  windows-cli:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify frozen bytes on a Windows clone
        run: python -m teobench verify
      - name: Native CLI, UTF-8 and container policy tests
        run: python -m unittest discover -s tests -p test_portability.py -v
      - name: Provider-independent stream collector regressions
        run: python -m unittest discover -s tests -p test_response_stream.py -v
      - name: Full campaign contract
        run: python -m unittest discover -s tests -p test_campaign.py -v
